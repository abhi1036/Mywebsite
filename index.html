<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151515">
    <meta name="description" content="A modern Hello World">
    <title>Hello World</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <div class="orb orb-left" aria-hidden="true"></div>
      <div class="orb orb-right" aria-hidden="true"></div>

      <section class="hello-card" aria-labelledby="hello-title">
        <div class="status" aria-label="Status: online">
          <span class="status-dot"></span>
          <span>HELLO FROM THE INTERNET</span>
        </div>

        <h1 id="hello-title">
          Hello<span class="accent">.</span><br>
          <span class="world">World</span>
        </h1>

        <div class="card-footer">
          <p>It starts with a simple hello.</p>
          <div class="arrow" aria-hidden="true">↗</div>
        </div>
      </section>
    </main>
  </body>
</html>
