<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="A modern Hello World">
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <div class="orb orb-left" aria-hidden="true"></div>
      <div class="orb orb-right" aria-hidden="true"></div>
      <div class="grid-overlay" aria-hidden="true"></div>

      <section class="hello-card" aria-labelledby="hello-title">
        <div class="status" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Hello from the internet</span>
        </div>

        <h1 id="hello-title">
          <span class="line">Hello<span class="accent">.</span></span>
          <span class="line world">World</span>
        </h1>

        <div class="card-footer">
          <p>It starts with a simple hello.</p>
          <a class="arrow" href="#" aria-label="Say hello">
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
